interface:
  display_name: "Lite No Comments"
  short_description: "Delete unjustified comments; fix code only when asked"
  default_prompt: "Use $superpowers-lite:lite-no-comments to review and delete unjustified comments in this scope. Apply application-code fixes only if I asked to fix what the comments hide or I approve a specific fix."

policy:
  allow_implicit_invocation: false
